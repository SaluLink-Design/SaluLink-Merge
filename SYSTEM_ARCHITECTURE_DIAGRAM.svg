<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .title-main { font-size: 32px; font-weight: bold; fill: #1a1a1a; }
      .title-sub { font-size: 14px; fill: #666; font-weight: 500; }
      .layer-title { font-size: 14px; font-weight: bold; fill: #fff; }
      .module-title { font-size: 12px; font-weight: bold; fill: #1a1a1a; }
      .module-text { font-size: 10px; fill: #333; }
      .legend-text { font-size: 11px; fill: #333; }
      .arrow { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
      .ai-arrow { stroke: #E74C3C; stroke-width: 2; marker-end: url(#arrowhead-red); stroke-dasharray: 5,5; }
      .integration-arrow { stroke: #3498DB; stroke-width: 2; marker-end: url(#arrowhead-blue); stroke-dasharray: 3,3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#666" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#E74C3C" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#3498DB" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>

  <!-- Header -->
  <text x="50" y="45" class="title-main">🏥 SaluLink</text>
  <text x="50" y="65" class="title-sub">AI-Powered Chronic Disease Management System</text>
  <text x="50" y="82" class="title-sub">Transforming Diagnosis into Intelligent Care Delivery</text>

  <!-- Legend (Top Right) -->
  <g id="legend">
    <rect x="1050" y="20" width="330" height="100" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
    
    <line x1="1065" y1="35" x2="1095" y2="35" stroke="#666" stroke-width="2"/>
    <text x="1105" y="40" class="legend-text">Data Flow</text>
    
    <line x1="1065" y1="55" x2="1095" y2="55" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="1105" y="60" class="legend-text">AI / Intelligence Flow</text>
    
    <line x1="1065" y1="75" x2="1095" y2="75" stroke="#3498DB" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="1105" y="80" class="legend-text">External Integration</text>
    
    <line x1="1065" y1="95" x2="1095" y2="95" stroke="#27AE60" stroke-width="2"/>
    <text x="1105" y="100" class="legend-text">Security & Compliance</text>
  </g>

  <!-- USER LAYER -->
  <g id="user-layer">
    <rect x="20" y="140" width="150" height="180" fill="#F8F4E6" stroke="#D4AF37" stroke-width="2" rx="4"/>
    <text x="35" y="160" class="layer-title" fill="#D4AF37">USER LAYER</text>
    <text x="35" y="180" class="module-text" font-weight="bold">Role-Based Access</text>
    
    <circle cx="70" cy="200" r="8" fill="#2C3E50"/>
    <text x="85" y="205" class="module-text">Clinicians</text>
    
    <circle cx="70" cy="225" r="8" fill="#2C3E50"/>
    <text x="85" y="230" class="module-text">Administrators</text>
    
    <circle cx="70" cy="250" r="8" fill="#2C3E50"/>
    <text x="85" y="255" class="module-text">Finance/Auditors</text>
    
    <circle cx="70" cy="275" r="8" fill="#2C3E50"/>
    <text x="85" y="280" class="module-text">External Partners</text>
    
    <circle cx="70" cy="300" r="8" fill="#2C3E50"/>
    <text x="85" y="305" class="module-text">AI Assistant (MIA)</text>
  </g>

  <!-- APPLICATION LAYER - 5 Core Modules -->
  <g id="app-layer">
    <!-- Module 1: Clinical Assessment -->
    <g id="mod1">
      <rect x="50" y="360" width="140" height="120" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="4"/>
      <circle cx="70" cy="375" r="15" fill="#3498DB"/>
      <text x="75" y="380" class="layer-title" fill="#fff">1</text>
      <text x="50" y="400" class="module-title" text-anchor="start">Clinical Assessment</text>
      <text x="55" y="420" class="module-text">• ClinicalBERT Analysis</text>
      <text x="55" y="435" class="module-text">• Condition Identification</text>
      <text x="55" y="450" class="module-text">• Confidence Scoring</text>
      <text x="55" y="465" class="module-text">• Note Processing</text>
    </g>

    <!-- Module 2: Diagnostic & Treatment -->
    <g id="mod2">
      <rect x="220" y="360" width="140" height="120" fill="#E8F8E8" stroke="#27AE60" stroke-width="2" rx="4"/>
      <circle cx="240" cy="375" r="15" fill="#27AE60"/>
      <text x="245" y="380" class="layer-title" fill="#fff">2</text>
      <text x="220" y="400" class="module-title" text-anchor="start">Diagnostic &amp;</text>
      <text x="220" y="415" class="module-title" text-anchor="start">Treatment Protocols</text>
      <text x="225" y="435" class="module-text">• ICD-10 Mapping</text>
      <text x="225" y="450" class="module-text">• Treatment Plans</text>
      <text x="225" y="465" class="module-text">• Medication Rules</text>
    </g>

    <!-- Module 3: PMB Compliance -->
    <g id="mod3">
      <rect x="390" y="360" width="140" height="120" fill="#F8E8E8" stroke="#E74C3C" stroke-width="2" rx="4"/>
      <circle cx="410" cy="375" r="15" fill="#E74C3C"/>
      <text x="415" y="380" class="layer-title" fill="#fff">3</text>
      <text x="390" y="400" class="module-title" text-anchor="start">PMB Compliance</text>
      <text x="390" y="415" class="module-title" text-anchor="start">&amp; Regulatory</text>
      <text x="395" y="435" class="module-text">• PMB Validation</text>
      <text x="395" y="450" class="module-text">• Regulatory Check</text>
      <text x="395" y="465" class="module-text">• Compliance Rules</text>
    </g>

    <!-- Module 4: Operational & Infrastructure -->
    <g id="mod4">
      <rect x="560" y="360" width="140" height="120" fill="#F0E8F8" stroke="#9B59B6" stroke-width="2" rx="4"/>
      <circle cx="580" cy="375" r="15" fill="#9B59B6"/>
      <text x="585" y="380" class="layer-title" fill="#fff">4</text>
      <text x="560" y="400" class="module-title" text-anchor="start">Operational &amp;</text>
      <text x="560" y="415" class="module-title" text-anchor="start">Infrastructure</text>
      <text x="565" y="435" class="module-text">• Workflows</text>
      <text x="565" y="450" class="module-text">• Case Management</text>
      <text x="565" y="465" class="module-text">• Scheduling</text>
    </g>

    <!-- Module 5: Strategic & Integration -->
    <g id="mod5">
      <rect x="730" y="360" width="140" height="120" fill="#F8F0E8" stroke="#E67E22" stroke-width="2" rx="4"/>
      <circle cx="750" cy="375" r="15" fill="#E67E22"/>
      <text x="755" y="380" class="layer-title" fill="#fff">5</text>
      <text x="730" y="400" class="module-title" text-anchor="start">Strategic &amp;</text>
      <text x="730" y="415" class="module-title" text-anchor="start">Integration Viability</text>
      <text x="735" y="435" class="module-text">• Analytics</text>
      <text x="735" y="450" class="module-text">• Reporting</text>
      <text x="735" y="465" class="module-text">• Insights</text>
    </g>

    <!-- Arrows from User Layer to App Layer -->
    <path d="M 95 320 L 120 360" class="arrow"/>
    <path d="M 95 320 L 290 360" class="arrow"/>
    <path d="M 95 320 L 460 360" class="arrow"/>
    <path d="M 95 320 L 630 360" class="arrow"/>
    <path d="M 95 320 L 800 360" class="arrow"/>
  </g>

  <!-- CORE APPLICATION LAYER LABEL -->
  <rect x="30" y="535" width="860" height="30" fill="#2C3E50" rx="4"/>
  <text x="460" y="555" class="layer-title" text-anchor="middle" fill="#fff">SAULINK CORE APPLICATION</text>

  <!-- AI / INTELLIGENCE SERVICES -->
  <g id="ai-layer">
    <text x="50" y="605" class="module-title">AI SERVICES &amp; INTELLIGENCE</text>
    
    <!-- Execution Intelligence -->
    <g id="ai1">
      <rect x="50" y="620" width="130" height="100" fill="#FFF3E0" stroke="#FF6B6B" stroke-width="1.5" rx="3"/>
      <text x="60" y="640" class="module-title" font-size="11">EXECUTION</text>
      <text x="60" y="655" class="module-title" font-size="11">INTELLIGENCE</text>
      <text x="60" y="675" class="module-text" font-size="9">• Document Analysis</text>
      <text x="60" y="690" class="module-text" font-size="9">• Pattern Detection</text>
      <text x="60" y="705" class="module-text" font-size="9">• Anomaly Alert</text>
    </g>

    <!-- Predictive Intelligence -->
    <g id="ai2">
      <rect x="210" y="620" width="130" height="100" fill="#FFF3E0" stroke="#FF6B6B" stroke-width="1.5" rx="3"/>
      <text x="220" y="640" class="module-title" font-size="11">PREDICTIVE</text>
      <text x="220" y="655" class="module-title" font-size="11">INTELLIGENCE</text>
      <text x="220" y="675" class="module-text" font-size="9">• Risk Scoring</text>
      <text x="220" y="690" class="module-text" font-size="9">• Forecasting</text>
      <text x="220" y="705" class="module-text" font-size="9">• Outcome Probability</text>
    </g>

    <!-- Strategic Intelligence -->
    <g id="ai3">
      <rect x="370" y="620" width="130" height="100" fill="#FFF3E0" stroke="#FF6B6B" stroke-width="1.5" rx="3"/>
      <text x="380" y="640" class="module-title" font-size="11">STRATEGIC</text>
      <text x="380" y="655" class="module-title" font-size="11">INTELLIGENCE</text>
      <text x="380" y="675" class="module-text" font-size="9">• Optimization</text>
      <text x="380" y="690" class="module-text" font-size="9">• Planning Insights</text>
      <text x="380" y="705" class="module-text" font-size="9">• Recommendations</text>
    </g>

    <!-- AI Services -->
    <g id="ai-services">
      <rect x="530" y="620" width="160" height="100" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="3"/>
      <text x="545" y="640" class="module-title" font-size="11">AI SERVICES</text>
      <text x="545" y="660" class="module-text" font-size="9">• ClinicalBERT Engine</text>
      <text x="545" y="675" class="module-text" font-size="9">• NLP Processing</text>
      <text x="545" y="690" class="module-text" font-size="9">• Knowledge Graph</text>
      <text x="545" y="705" class="module-text" font-size="9">• Medical LLM</text>
    </g>

    <!-- Arrows from App to AI -->
    <path d="M 120 480 L 120 620" class="ai-arrow" stroke-width="2"/>
    <path d="M 290 480 L 275 620" class="ai-arrow" stroke-width="2"/>
    <path d="M 460 480 L 435 620" class="ai-arrow" stroke-width="2"/>
    <path d="M 630 480 L 590 620" class="ai-arrow" stroke-width="2"/>
  </g>

  <!-- DATA LAYER -->
  <g id="data-layer">
    <text x="50" y="770" class="module-title">DATA FOUNDATION</text>
    
    <g id="data1">
      <rect x="50" y="785" width="110" height="80" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5" rx="3"/>
      <text x="60" y="805" class="module-title" font-size="10">Patient Data</text>
      <text x="60" y="822" class="module-text" font-size="9">• Demographics</text>
      <text x="60" y="837" class="module-text" font-size="9">• Medical History</text>
      <text x="60" y="852" class="module-text" font-size="9">• Plan Info</text>
    </g>

    <g id="data2">
      <rect x="180" y="785" width="110" height="80" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5" rx="3"/>
      <text x="190" y="805" class="module-title" font-size="10">Clinical Data</text>
      <text x="190" y="822" class="module-text" font-size="9">• Notes</text>
      <text x="190" y="837" class="module-text" font-size="9">• Diagnostics</text>
      <text x="190" y="852" class="module-text" font-size="9">• Treatments</text>
    </g>

    <g id="data3">
      <rect x="310" y="785" width="110" height="80" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5" rx="3"/>
      <text x="320" y="805" class="module-title" font-size="10">Risk &amp; Insights</text>
      <text x="320" y="822" class="module-text" font-size="9">• Risk Scores</text>
      <text x="320" y="837" class="module-text" font-size="9">• Analytics</text>
      <text x="320" y="852" class="module-text" font-size="9">• Flags</text>
    </g>

    <g id="data4">
      <rect x="440" y="785" width="110" height="80" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5" rx="3"/>
      <text x="450" y="805" class="module-title" font-size="10">User &amp; Access</text>
      <text x="450" y="822" class="module-text" font-size="9">• Users</text>
      <text x="450" y="837" class="module-text" font-size="9">• Roles</text>
      <text x="450" y="852" class="module-text" font-size="9">• Permissions</text>
    </g>

    <g id="data5">
      <rect x="570" y="785" width="110" height="80" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5" rx="3"/>
      <text x="580" y="805" class="module-title" font-size="10">Activity &amp; Audit</text>
      <text x="580" y="822" class="module-text" font-size="9">• Activities</text>
      <text x="580" y="837" class="module-text" font-size="9">• Logs</text>
      <text x="580" y="852" class="module-text" font-size="9">• Audit Trail</text>
    </g>

    <!-- Arrows from AI to Data -->
    <path d="M 115 720 L 105 785" class="arrow" stroke-width="1.5"/>
    <path d="M 275 720 L 235 785" class="arrow" stroke-width="1.5"/>
    <path d="M 435 720 L 365 785" class="arrow" stroke-width="1.5"/>
    <path d="M 590 720 L 495 785" class="arrow" stroke-width="1.5"/>
  </g>

  <!-- INTEGRATION LAYER -->
  <g id="integration-layer">
    <text x="50" y="920" class="module-title">EXTERNAL INTEGRATIONS</text>
    
    <g id="int1">
      <rect x="50" y="935" width="95" height="45" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="3"/>
      <text x="60" y="955" class="module-text" font-size="9" font-weight="bold">Medical Schemes</text>
      <text x="60" y="970" class="module-text" font-size="8">• PMB Rules</text>
    </g>

    <g id="int2">
      <rect x="160" y="935" width="95" height="45" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="3"/>
      <text x="170" y="955" class="module-text" font-size="9" font-weight="bold">Healthcare Systems</text>
      <text x="170" y="970" class="module-text" font-size="8">• EHR/EMR</text>
    </g>

    <g id="int3">
      <rect x="270" y="935" width="95" height="45" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="3"/>
      <text x="280" y="955" class="module-text" font-size="9" font-weight="bold">Pharmacy Systems</text>
      <text x="280" y="970" class="module-text" font-size="8">• Drug Database</text>
    </g>

    <g id="int4">
      <rect x="380" y="935" width="95" height="45" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="3"/>
      <text x="390" y="955" class="module-text" font-size="9" font-weight="bold">Lab Services</text>
      <text x="390" y="970" class="module-text" font-size="8">• Test Results</text>
    </g>

    <g id="int5">
      <rect x="490" y="935" width="95" height="45" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="3"/>
      <text x="500" y="955" class="module-text" font-size="9" font-weight="bold">Identity Mgmt</text>
      <text x="500" y="970" class="module-text" font-size="8">• Auth Services</text>
    </g>

    <!-- Arrows from Data to Integrations -->
    <path d="M 105 865 L 100 935" class="integration-arrow" stroke-width="1.5"/>
    <path d="M 235 865 L 210 935" class="integration-arrow" stroke-width="1.5"/>
    <path d="M 365 865 L 320 935" class="integration-arrow" stroke-width="1.5"/>
    <path d="M 495 865 L 430 935" class="integration-arrow" stroke-width="1.5"/>
  </g>

  <!-- RIGHT SIDE: CROSS-CUTTING CAPABILITIES -->
  <g id="cross-cutting">
    <rect x="900" y="140" width="450" height="750" fill="#FFF" stroke="#ddd" stroke-width="1" rx="4" opacity="0.95"/>
    
    <text x="920" y="165" class="module-title" font-size="14">CROSS-CUTTING</text>
    <text x="920" y="182" class="module-title" font-size="14">CAPABILITIES</text>

    <!-- Security & Access -->
    <g id="cc1">
      <rect x="920" y="210" width="400" height="80" fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="3"/>
      <circle cx="945" cy="235" r="12" fill="#C62828"/>
      <text x="970" y="240" class="module-text" font-weight="bold">🔒 SECURITY &amp; ACCESS</text>
      <text x="970" y="258" class="module-text">• Role-Based Access Control (RBAC)</text>
      <text x="970" y="273" class="module-text">• Data Encryption (AES-256)</text>
      <text x="970" y="288" class="module-text">• Multi-Factor Authentication (MFA)</text>
    </g>

    <!-- Compliance & Audit -->
    <g id="cc2">
      <rect x="920" y="305" width="400" height="80" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2" rx="3"/>
      <circle cx="945" cy="330" r="12" fill="#6A1B9A"/>
      <text x="970" y="335" class="module-text" font-weight="bold">📋 COMPLIANCE &amp; AUDIT</text>
      <text x="970" y="353" class="module-text">• Regulatory Compliance Tracking</text>
      <text x="970" y="368" class="module-text">• Audit Logging &amp; Retention</text>
      <text x="970" y="383" class="module-text">• PMB &amp; POPIA Validation</text>
    </g>

    <!-- Monitoring & Alerts -->
    <g id="cc3">
      <rect x="920" y="400" width="400" height="80" fill="#E8F5E9" stroke="#1B5E20" stroke-width="2" rx="3"/>
      <circle cx="945" cy="425" r="12" fill="#1B5E20"/>
      <text x="970" y="430" class="module-text" font-weight="bold">📊 MONITORING &amp; ALERTS</text>
      <text x="970" y="448" class="module-text">• System Performance Monitoring</text>
      <text x="970" y="463" class="module-text">• Real-time Alerts &amp; Notifications</text>
      <text x="970" y="478" class="module-text">• SLA Management</text>
    </g>

    <!-- Configuration -->
    <g id="cc4">
      <rect x="920" y="495" width="400" height="80" fill="#E1F5FE" stroke="#0277BD" stroke-width="2" rx="3"/>
      <circle cx="945" cy="520" r="12" fill="#0277BD"/>
      <text x="970" y="525" class="module-text" font-weight="bold">⚙️ CONFIGURATION</text>
      <text x="970" y="543" class="module-text">• Custom Fields &amp; Workflows</text>
      <text x="970" y="558" class="module-text">• Business Rules Engine</text>
      <text x="970" y="573" class="module-text">• Template Management</text>
    </g>

    <!-- Admin & Settings -->
    <g id="cc5">
      <rect x="920" y="590" width="400" height="80" fill="#FFF3E0" stroke="#E65100" stroke-width="2" rx="3"/>
      <circle cx="945" cy="615" r="12" fill="#E65100"/>
      <text x="970" y="620" class="module-text" font-weight="bold">👤 ADMIN &amp; SETTINGS</text>
      <text x="970" y="638" class="module-text">• User Management</text>
      <text x="970" y="653" class="module-text">• Organization Settings</text>
      <text x="970" y="668" class="module-text">• System Configuration</text>
    </g>

    <!-- Performance & Scalability -->
    <g id="cc6">
      <rect x="920" y="685" width="400" height="80" fill="#F1F8E9" stroke="#33691E" stroke-width="2" rx="3"/>
      <circle cx="945" cy="710" r="12" fill="#33691E"/>
      <text x="970" y="715" class="module-text" font-weight="bold">⚡ PERFORMANCE &amp; SCALABILITY</text>
      <text x="970" y="733" class="module-text">• Load Balancing</text>
      <text x="970" y="748" class="module-text">• Caching &amp; Optimization</text>
      <text x="970" y="763" class="module-text">• Auto-scaling Infrastructure</text>
    </g>
  </g>

  <!-- BOTTOM LEGEND -->
  <g id="bottom-info">
    <text x="50" y="975" class="module-text" font-size="10">Version 1.0 | SaluLink Chronic Disease Management System | AI-Powered Clinical Intelligence Platform</text>
  </g>
</svg>